name: Reprobe missing streams

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Number of titles per run"
        required: false
        default: "70000"
      reset:
        description: "Reset cursor to 0 (re-sweep from start)"
        required: false
        type: boolean
        default: false

# Scheduled cron disabled — initial 78,150-title sweep complete (2026-10-26).
# Re-enable by uncommenting the `schedule:` block below if new misses appear.
# schedule:
#   - cron: "0 */6 * * *"

concurrency:
  group: reprobe
  cancel-in-progress: false

jobs:
  reprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone data repo
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git clone "https://x-access-token:${PAT_TOKEN}@github.com/hinduaichat/lifestream-collector-data.git" data-repo
          cd data-repo
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"

      - name: Reset cursor (optional)
        if: ${{ inputs.reset == true }}
        run: |
          cd data-repo
          jq '.cursor = 0 | .recovered = 0 | .stillMissing = 0 | .recoveredIds = []' data/reprobe-state.json > /tmp/state.json
          mv /tmp/state.json data/reprobe-state.json
          echo "[]' > data/recovered-titles.json
          echo "Cursor reset to 0."

      - name: Run reprobe
        env:
          BATCH: ${{ github.event.inputs.batch || '70000' }}
        run: |
          cd data-repo
          node reprobe.mjs --batch="${BATCH}" --concurrency=10

      - name: Commit and push
        if: always()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          cd data-repo
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Reprobe: full sweep @ $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin main

      - name: Summary
        if: always()
        run: |
          cd data-repo || exit 0
          if [ -f data/reprobe-state.json ]; then
            CURSOR=$(jq -r '.cursor' data/reprobe-state.json)
            TOTAL=$(jq -r '.total' data/reprobe-state.json)
            RECOVERED=$(jq -r '.recovered' data/reprobe-state.json)
            MISSING=$(jq -r '.stillMissing' data/reprobe-state.json)
            PCT=$(awk "BEGIN{printf \"%.2f\", ${CURSOR}*100/${TOTAL}}")
            echo "## Reprobe Progress" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Cursor | ${CURSOR} / ${TOTAL} (${PCT}%) |" >> $GITHUB_STEP_SUMMARY
            echo "| Recovered | ${RECOVERED} |" >> $GITHUB_STEP_SUMMARY
            echo "| Still Missing | ${MISSING} |" >> $GITHUB_STEP_SUMMARY
          fi
