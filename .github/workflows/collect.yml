name: Collect missing streams

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Number of titles to process"
        required: false
        default: "1000"
      mode:
        description: "collect (embed URLs) or reprobe (direct stream check)"
        required: false
        default: "reprobe"
  schedule:
    - cron: "0 */2 * * *"

concurrency:
  group: collect-streams
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout collector
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone private data repo
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${PAT_TOKEN}@github.com/hinduaichat/lifestream-collector-data.git" data-repo
          cd data-repo
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"

      - name: Run reprobe (direct stream check)
        if: github.event.inputs.mode != 'collect'
        env:
          BATCH: ${{ github.event.inputs.batch || '1000' }}
        run: |
          cd data-repo
          node reprobe.mjs --batch="${BATCH}" --concurrency=10

      - name: Run collect (embed URLs)
        if: github.event.inputs.mode == 'collect'
        env:
          BATCH: ${{ github.event.inputs.batch || '1000' }}
        run: |
          cd data-repo
          node collect.mjs --batch="${BATCH}" --concurrency=10

      - name: Commit and push
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          cd data-repo
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Auto-reprobe batch @ $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin main

      - name: Summary
        if: always()
        run: |
          cd data-repo || exit 0
          if [ -f data/reprobe-state.json ]; then
            CURSOR=$(jq -r '.cursor' data/reprobe-state.json)
            TOTAL=$(jq -r '.total' data/reprobe-state.json)
            RECOVERED=$(jq -r '.recovered' data/reprobe-state.json)
            MISSING=$(jq -r '.stillMissing' data/reprobe-state.json)
            echo "## Reprobe Progress" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Cursor | ${CURSOR} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| Recovered | ${RECOVERED} |" >> $GITHUB_STEP_SUMMARY
            echo "| Still Missing | ${MISSING} |" >> $GITHUB_STEP_SUMMARY
          fi
