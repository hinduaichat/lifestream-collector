name: Reprobe all missing streams

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Number of titles"
        required: false
        default: "70000"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: reprobe
  cancel-in-progress: false

jobs:
  reprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone data repo
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git clone "https://x-access-token:${PAT_TOKEN}@github.com/hinduaichat/lifestream-collector-data.git" data-repo
          cd data-repo
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"

      - name: Run reprobe (ALL remaining titles)
        env:
          BATCH: ${{ github.event.inputs.batch || '70000' }}
        run: |
          cd data-repo
          node reprobe.mjs --batch="${BATCH}" --concurrency=10

      - name: Commit and push
        if: always()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          cd data-repo
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Reprobe: full sweep @ $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin main

      - name: Summary
        if: always()
        run: |
          cd data-repo || exit 0
          if [ -f data/reprobe-state.json ]; then
            CURSOR=$(jq -r '.cursor' data/reprobe-state.json)
            TOTAL=$(jq -r '.total' data/reprobe-state.json)
            RECOVERED=$(jq -r '.recovered' data/reprobe-state.json)
            MISSING=$(jq -r '.stillMissing' data/reprobe-state.json)
            echo "## Reprobe Progress" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Cursor | ${CURSOR} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| Recovered | ${RECOVERED} |" >> $GITHUB_STEP_SUMMARY
            echo "| Still Missing | ${MISSING} |" >> $GITHUB_STEP_SUMMARY
          fi
